<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TimeTracker</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="dash">
  <div class="filters">
    <span class="pill" id="dev" style="font-weight:600"></span>
    <span class="seg-ctl" id="periods" role="tablist"></span>
    <span class="nav"><button id="prev">‹</button><span class="lbl" id="lbl"></span><button id="next">›</button></span>
    <button id="todaybtn"></button>
    <span class="sp"></span>
    <button id="export"></button>
    <button id="about" class="roundbtn"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="10" cy="10" r="8"/><path d="M10 9v5" stroke-linecap="round"/><circle cx="10" cy="6.2" r=".6" fill="currentColor"/></svg></button>
  </div>
  <div id="content"></div>
</div>
<div id="modal"></div>
<script src="common.js"></script>
<script src="charts.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
